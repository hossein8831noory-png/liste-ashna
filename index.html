<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیست بچه‌های گروه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#fbe4ec;
    --lilac:#efe0f7;
    --peach:#ffe9df;
    --rose:#e88aa0;
    --plum:#5b3a4c;
    --plum-soft:#8a6478;
    --gold:#d9a441;
    --ok-green:#8fae8a;
    --card:#fffaf9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn', sans-serif;
    color:var(--plum);
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,.55), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(239,224,247,.7), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(255,233,223,.8), transparent 55%),
      linear-gradient(160deg, var(--blush), var(--lilac) 55%, var(--peach));
    background-attachment:fixed;
    overflow-x:hidden;
    position:relative;
  }
  .blob{
    position:fixed; border-radius:50%; filter:blur(60px); opacity:.5; z-index:0; pointer-events:none;
    animation:float 14s ease-in-out infinite;
  }
  .blob1{width:280px;height:280px;background:#f6b8cd;top:-60px;left:-60px;}
  .blob2{width:340px;height:340px;background:#d7bdf0;bottom:-100px;right:-80px;animation-delay:2s;}
  .blob3{width:200px;height:200px;background:#ffd0b0;bottom:20%;left:10%;animation-delay:4s;}
  @keyframes float{
    0%,100%{transform:translateY(0) translateX(0);}
    50%{transform:translateY(-24px) translateX(14px);}
  }
  @media (prefers-reduced-motion: reduce){ .blob{animation:none;} }

  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:18px 16px 60px;}

  .designer-tag{
    text-align:center;font-size:12px;letter-spacing:2px;color:var(--plum-soft);
    opacity:.75;margin-bottom:6px;text-transform:uppercase;
  }

  header.hero{text-align:center;padding:18px 10px 26px;}
  header.hero h1{
    font-size:32px;margin:0 0 6px;font-weight:800;color:var(--plum);
    letter-spacing:.5px;
  }
  header.hero h1 span{color:var(--rose);}
  header.hero p{margin:0;color:var(--plum-soft);font-size:14.5px;line-height:1.8;}

  .toolbar{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 8px;
  }
  .btn{
    border:none;cursor:pointer;padding:11px 22px;border-radius:999px;font-family:inherit;
    font-size:14.5px;font-weight:600;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--rose),#d9748c);color:#fff;box-shadow:0 6px 18px rgba(216,116,140,.35);}
  .btn-primary:hover{box-shadow:0 8px 22px rgba(216,116,140,.45);}
  .btn-ghost{background:rgba(255,255,255,.6);color:var(--plum);border:1px solid rgba(139,100,120,.25);}
  .btn-ghost:hover{background:rgba(255,255,255,.85);}

  .status-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0 24px;font-size:13px;color:var(--plum-soft);}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:middle;}

  .section-title{
    display:flex;align-items:center;gap:10px;margin:34px 0 14px;
  }
  .section-title h2{font-size:17px;margin:0;font-weight:700;color:var(--plum);white-space:nowrap;}
  .section-title .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(139,100,120,.35),transparent);}
  .section-title .count{font-size:12.5px;color:var(--plum-soft);background:rgba(255,255,255,.6);padding:2px 10px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}

  .card{
    background:var(--card);
    border-radius:20px;
    padding:16px 16px 14px;
    box-shadow:0 8px 24px rgba(139,80,105,.10);
    border:1px solid rgba(255,255,255,.7);
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(139,80,105,.16);}
  .card .name{font-size:16.5px;font-weight:700;margin:0 0 4px;color:var(--plum);}
  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
    padding:3px 10px;border-radius:999px;margin-bottom:9px;
  }
  .badge.single{background:#fdeef1;color:var(--rose);}
  .badge.relationship{background:#f1ece0;color:#a9843a;}
  .badge.unknown{background:#eef0ea;color:#7a8a6e;}
  .card .bio{font-size:13px;line-height:1.75;color:var(--plum-soft);min-height:20px;margin-bottom:10px;white-space:pre-wrap;}
  .card .bio.empty{font-style:italic;opacity:.6;}
  .rubika-link{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    color:#fff;background:linear-gradient(135deg,var(--rose),#c9647e);
    padding:7px 12px;border-radius:12px;text-decoration:none;
  }
  .rubika-link:hover{filter:brightness(1.06);}
  .private-tag{font-size:12px;color:var(--plum-soft);opacity:.7;}

  .empty-state{text-align:center;color:var(--plum-soft);font-size:14px;padding:30px 0;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(74,46,58,.35);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    background:#fffdfc;border-radius:22px;max-width:420px;width:100%;
    padding:24px 22px;box-shadow:0 20px 50px rgba(90,50,65,.25);
    max-height:88vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 4px;font-size:18px;color:var(--plum);}
  .modal .sub{font-size:13px;color:var(--plum-soft);margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--plum);margin-bottom:6px;}
  select, textarea, input[type=text]{
    width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(139,100,120,.25);
    font-family:inherit;font-size:14px;background:#fff;color:var(--plum);resize:vertical;
  }
  select:focus, textarea:focus, input:focus{outline:2px solid var(--rose);outline-offset:1px;}
  .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-pill{
    flex:1;min-width:90px;text-align:center;padding:9px 8px;border-radius:12px;
    border:1.5px solid rgba(139,100,120,.25);cursor:pointer;font-size:13px;font-weight:600;color:var(--plum-soft);
    transition:all .15s ease;
  }
  .radio-pill input{display:none;}
  .radio-pill.active-single{border-color:var(--rose);background:#fdeef1;color:var(--rose);}
  .radio-pill.active-relationship{border-color:var(--gold);background:#f7efdd;color:#a9843a;}
  .radio-pill.active-unknown{border-color:#8fae8a;background:#eef0ea;color:#5f7256;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .close-x{position:absolute;top:14px;left:14px;background:none;border:none;font-size:18px;color:var(--plum-soft);cursor:pointer;}
  .modal{position:relative;}
  .note{font-size:12px;color:var(--plum-soft);margin-top:10px;line-height:1.7;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--plum);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:60;opacity:0;transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
  footer.foot{text-align:center;margin-top:36px;font-size:12px;color:var(--plum-soft);opacity:.7;}

  /* Tabs */
  .tabbar{display:flex;gap:8px;justify-content:center;margin:22px 0 4px;}
  .tab-btn{
    border:none;background:rgba(255,255,255,.55);color:var(--plum-soft);
    padding:9px 18px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
  }
  .tab-btn.active{background:linear-gradient(135deg,var(--rose),#d9748c);color:#fff;}

  /* Game */
  .game-card{
    background:var(--card);border-radius:22px;padding:22px 18px;margin-top:18px;
    box-shadow:0 8px 24px rgba(139,80,105,.10);text-align:center;
  }
  .game-card h3{margin:0 0 10px;font-size:18px;color:var(--plum);}
  .game-card p.sub{font-size:13.5px;color:var(--plum-soft);margin:0 0 16px;line-height:1.8;}
  .player-chip{
    display:inline-flex;align-items:center;gap:6px;background:#fdeef1;color:var(--rose);
    padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;margin:4px;
  }
  .player-chip.turn{background:linear-gradient(135deg,var(--rose),#d9748c);color:#fff;}
  .bottle-wrap{
    width:120px;height:120px;margin:20px auto;position:relative;
    display:flex;align-items:center;justify-content:center;
  }
  .bottle-emoji{
    font-size:64px;display:inline-block;
    transition:transform 2.2s cubic-bezier(.17,.67,.29,1.01);
    transform:rotate(0deg);
    cursor:pointer;
  }
  .bottle-emoji.disabled{cursor:default;opacity:.55;}
  .spin-result{
    margin-top:14px;font-size:16px;font-weight:700;color:var(--plum);
    background:#f7efdd;padding:12px 16px;border-radius:14px;line-height:1.9;
  }
  .name-select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(139,100,120,.25);font-family:inherit;font-size:14px;background:#fff;color:var(--plum);}

</style>
</head>
<body>
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="wrap">
  <div class="designer-tag">طراح: OFF</div>
  <header class="hero">
    <h1>وضعیت <span>قلب</span> بچه‌های گروه 💌</h1>
    <p>هر کی سینگله، آیدی روبیکاش پایین کارتشه — هر کی تو رابطه‌ست، فقط باهاش گرم بگیر 😌<br>وضعیتت عوض شده؟ برو پایین و آپدیتش کن.</p>
  </header>

  <div class="toolbar">
    <button class="btn btn-primary" id="openIdentify">ورود / آپدیت وضعیت من</button>
    <button class="btn btn-ghost" id="refreshBtn">🔄 بروزرسانی لیست</button>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" id="tabList">💌 لیست</button>
    <button class="tab-btn" id="tabGame">🍾 جرأت یا حقیقت</button>
  </div>

  <div id="listView">
  <div class="status-legend">
    <span><span class="legend-dot" style="background:var(--rose)"></span>سینگل</span>
    <span><span class="legend-dot" style="background:var(--gold)"></span>تو رابطه</span>
    <span><span class="legend-dot" style="background:#8fae8a"></span>وضعیت نامعلوم</span>
  </div>

  <div id="listRoot"></div>
  </div>

  <div id="gameView" style="display:none;"></div>

  <footer class="foot">فقط برای اعضای گروه — لطفاً لینک رو جای دیگه پخش نکن 🤍</footer>
</div>

<div id="toast" class="toast"></div>
<div id="modalRoot"></div>
<div id="whoAmIRoot"></div>


<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwckddfB54509nta9468xf0SnG7ZMqhlP2WUEaWZFFPfIPaiNqRSaEyL5PakLUaNVU/exec';
const REFRESH_MS = 30000; // polls frequently so the list feels live

const SEED = [
  {id:0,  name:"یسنا",              status:"single",       rubika:"@Denizzz__900",  bio:""},
  {id:1,  name:"نیلماه",            status:"single",       rubika:"@Nilmah_nilmah", bio:""},
  {id:2,  name:"امین",              status:"relationship", rubika:"@aminbul110",    bio:""},
  {id:3,  name:"نگار",              status:"single",       rubika:"@Negarnazar90",  bio:""},
  {id:4,  name:"ابول",              status:"relationship", rubika:"@Aboltex",       bio:""},
  {id:5,  name:"امیر",              status:"relationship", rubika:"@Amir__Jafari3", bio:""},
  {id:6,  name:"یاشار",             status:"single",       rubika:"@yaskaaas",      bio:""},
  {id:7,  name:"ریحانه",            status:"relationship", rubika:"@reyhaneh3_96",  bio:""},
  {id:8,  name:"فاطمه",             status:"relationship", rubika:"@R_123456778",   bio:""},
  {id:9,  name:"هستی",              status:"single",       rubika:"@Stbir23",       bio:""},
  {id:10, name:"پرنیا",             status:"single",       rubika:"@Snowfwakes",    bio:""},
  {id:11, name:"مانی",              status:"single",       rubika:"@Ma_NiY8",       bio:""},
  {id:12, name:"علی",               status:"single",       rubika:"@aliahaker",     bio:""},
  {id:13, name:"اشکان",             status:"single",       rubika:"@ashkan__timoory", bio:""},
  {id:14, name:"سارینا",            status:"relationship", rubika:"@mahtab__189",   bio:""},
  {id:15, name:"حسین",              status:"single",       rubika:"@H_Alizadeh_N",  bio:""},
  {id:16, name:"فاطمه",             status:"single",       rubika:"@Denizzz__90",   bio:""},
  {id:17, name:"هانا",              status:"unknown",      rubika:"@Hanna79n",      bio:""},
  {id:18, name:"رونیکا",            status:"unknown",      rubika:"@Ronika9577",    bio:""},
];

let members = [];

function statusLabel(s){
  return s==='single' ? 'سینگل' : s==='relationship' ? 'تو رابطه' : 'وضعیت نامعلوم';
}

async function loadMembers(){
  try{
    const res = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
    const data = await res.json();
    members = data.map(raw => {
      // the sheet's header row may have stray spaces/casing; normalize keys
      // (e.g. "name " -> "name") before reading each field
      const norm = {};
      Object.keys(raw).forEach(k => { norm[k.trim().toLowerCase()] = raw[k]; });
      return {
        id: Number(norm.id),
        name: String(norm.name || '').trim(),
        status: String(norm.status || 'unknown').trim(),
        rubika: String(norm.rubika || '').trim(),
        bio: String(norm.bio || '')
      };
    });
  }catch(e){
    console.error('load failed', e);
    if(!members.length) members = SEED;
    showToast('اتصال به لیست برقرار نشد، لیست ذخیره‌شده‌ی قبلی نشون داده می‌شه');
  }
}

async function saveMember(m, password, newPassword){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight Apps Script can't handle
      body: JSON.stringify({ id: m.id, status: m.status, rubika: m.rubika, bio: m.bio, password: password, newPassword: newPassword || undefined })
    });
    const data = await res.json();
    return { ok: !!(data && data.ok), error: data && data.error };
  }catch(e){
    console.error('save failed', e);
    return { ok: false };
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function rubikaHref(handle){
  const clean = handle.replace(/^@/, '').trim();
  return 'https://rubika.ir/' + encodeURIComponent(clean);
}

function renderCard(m){
  const bioText = m.bio && m.bio.trim() ? m.bio.trim() : 'هنوز چیزی درباره خودش ننوشته';
  const bioClass = m.bio && m.bio.trim() ? 'bio' : 'bio empty';
  const rubikaBlock = m.status === 'single'
    ? `<a class="rubika-link" href="${rubikaHref(m.rubika)}" target="_blank" rel="noopener">💬 ${m.rubika}</a>`
    : `<span class="private-tag">آیدی نمایش داده نمی‌شه</span>`;
  return `
    <div class="card">
      <p class="name">${escapeHtml(m.name)}</p>
      <span class="badge ${m.status}">${statusLabel(m.status)}</span>
      <p class="${bioClass}">${escapeHtml(bioText)}</p>
      ${rubikaBlock}
    </div>`;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderList(){
  const root = document.getElementById('listRoot');
  if(!members.length){ root.innerHTML = '<div class="empty-state">لیست خالیه</div>'; return; }

  const groups = [
    {key:'single', title:'سینگل‌ها'},
    {key:'relationship', title:'تو رابطه‌ان'},
    {key:'unknown', title:'وضعیت نامعلوم'},
  ];

  let html = '';
  groups.forEach(g=>{
    const items = members.filter(m=>m.status===g.key);
    if(!items.length) return;
    html += `
      <div class="section-title">
        <h2>${g.title}</h2>
        <div class="line"></div>
        <span class="count">${items.length} نفر</span>
      </div>
      <div class="grid">${items.map(renderCard).join('')}</div>`;
  });
  root.innerHTML = html;
}

function openIdentifyModal(){
  const root = document.getElementById('modalRoot');
  const options = members.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <button class="close-x" id="closeModal">✕</button>
        <h3>خودت رو انتخاب کن</h3>
        <p class="sub">اول بگو کدوم یکی از لیست تویی، بعد وضعیتت رو آپدیت کن</p>
        <div class="field">
          <label>اسم من:</label>
          <select id="whoSelect">
            <option value="">— انتخاب کن —</option>
            ${options}
          </select>
        </div>
        <div id="editArea"></div>
      </div>
    </div>`;
  document.getElementById('closeModal').onclick = closeModal;
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('whoSelect').onchange = (e)=>{
    const id = e.target.value;
    renderEditArea(id === '' ? null : parseInt(id));
  };
}

function renderEditArea(id){
  const area = document.getElementById('editArea');
  if(id === null){ area.innerHTML = ''; return; }
  const m = members.find(x=>x.id===id);
  area.innerHTML = `
    <div class="field">
      <label>وضعیت فعلیم:</label>
      <div class="radio-row" id="statusRow">
        <label class="radio-pill ${m.status==='single'?'active-single':''}" data-val="single">
          <input type="radio" name="st" value="single" ${m.status==='single'?'checked':''}>سینگل
        </label>
        <label class="radio-pill ${m.status==='relationship'?'active-relationship':''}" data-val="relationship">
          <input type="radio" name="st" value="relationship" ${m.status==='relationship'?'checked':''}>تو رابطه
        </label>
        <label class="radio-pill ${m.status==='unknown'?'active-unknown':''}" data-val="unknown">
          <input type="radio" name="st" value="unknown" ${m.status==='unknown'?'checked':''}>نامعلوم
        </label>
      </div>
    </div>
    <div class="field">
      <label>آیدی روبیکام:</label>
      <input type="text" id="rubikaInput" value="${escapeHtml(m.rubika)}">
    </div>
    <div class="field">
      <label>یه کم درباره خودم (اخلاق، ویژگی‌ها، علایق و ...):</label>
      <textarea id="bioInput" rows="4" placeholder="مثلاً: آرومم، شوخ‌طبعم، عاشق فیلمم، دنبال یکی که...">${escapeHtml(m.bio||'')}</textarea>
    </div>
    <div class="field">
      <label>رمز فعلیت:</label>
      <input type="password" id="passwordInput" placeholder="رمزی که تو پی‌وی بهت داده شد">
    </div>
    <div class="field">
      <button type="button" class="btn btn-ghost" id="togglePwChange" style="width:100%;">🔒 می‌خوام رمزمو به دلخواه خودم عوض کنم</button>
      <div id="pwChangeArea" style="display:none;margin-top:10px;">
        <label>رمز جدید:</label>
        <input type="password" id="newPasswordInput" placeholder="حداقل ۴ کاراکتر">
        <label style="margin-top:8px;display:block;">تکرار رمز جدید:</label>
        <input type="password" id="newPasswordConfirm" placeholder="دوباره بنویسش">
      </div>
    </div>
    <p class="note">آیدی روبیکات فقط وقتی زیر کارتت نشون داده می‌شه که وضعیتت «سینگل» باشه.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelEdit">انصراف</button>
      <button class="btn btn-primary" id="saveEdit">ذخیره</button>
    </div>`;

  document.getElementById('togglePwChange').onclick = ()=>{
    const pwArea = document.getElementById('pwChangeArea');
    pwArea.style.display = pwArea.style.display === 'none' ? '' : 'none';
  };

  area.querySelectorAll('.radio-pill').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      area.querySelectorAll('.radio-pill').forEach(p=>{
        p.classList.remove('active-single','active-relationship','active-unknown');
      });
      pill.classList.add('active-' + pill.dataset.val);
    });
  });

  document.getElementById('cancelEdit').onclick = closeModal;
  document.getElementById('saveEdit').onclick = async ()=>{
    const status = area.querySelector('input[name=st]:checked').value;
    const rubika = document.getElementById('rubikaInput').value.trim() || m.rubika;
    const bio = document.getElementById('bioInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    if(!password){ showToast('رمز فعلیتو وارد کن'); return; }
    let newPassword = null;
    if(document.getElementById('pwChangeArea').style.display !== 'none'){
      const np = document.getElementById('newPasswordInput').value;
      const npc = document.getElementById('newPasswordConfirm').value;
      if(np.length < 4){ showToast('رمز جدید باید حداقل ۴ کاراکتر باشه'); return; }
      if(np !== npc){ showToast('تکرار رمز جدید درست نیست'); return; }
      newPassword = np;
    }
    // look up the live object by id (not the closured "m") in case the
    // background auto-refresh replaced the members array while this was open
    const target = members.find(x=>x.id===id) || m;
    const prev = { status: target.status, rubika: target.rubika, bio: target.bio };
    target.status = status; target.rubika = rubika; target.bio = bio;
    const saveBtn = document.getElementById('saveEdit');
    saveBtn.disabled = true;
    saveBtn.textContent = 'در حال ذخیره...';
    const result = await saveMember(target, password, newPassword);
    if(result.ok){
      renderList();
      closeModal();
      showToast(newPassword ? 'ذخیره شد و رمزت عوض شد ✅' : 'وضعیتت آپدیت شد ✅');
      await loadMembers();
      renderList();
    }else{
      target.status = prev.status; target.rubika = prev.rubika; target.bio = prev.bio;
      saveBtn.disabled = false;
      saveBtn.textContent = 'ذخیره';
      showToast(result.error === 'bad_password' ? 'رمز اشتباهه ❌' : 'ذخیره نشد، اتصالت رو چک کن و دوباره بزن');
    }
  };
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

document.getElementById('openIdentify').onclick = openIdentifyModal;
document.getElementById('refreshBtn').onclick = async ()=>{
  await loadMembers();
  renderList();
  showToast('لیست بروز شد');
};

/* ===================== Tabs ===================== */
let me = null; // { id, name } — who the current browser session is
let gamePollTimer = null;

document.getElementById('tabList').onclick = ()=> switchTab('list');
document.getElementById('tabGame').onclick = ()=> switchTab('game');

function switchTab(tab){
  const isList = tab === 'list';
  document.getElementById('listView').style.display = isList ? '' : 'none';
  document.getElementById('gameView').style.display = isList ? 'none' : '';
  document.getElementById('tabList').classList.toggle('active', isList);
  document.getElementById('tabGame').classList.toggle('active', !isList);
  if(isList){
    if(gamePollTimer){ clearInterval(gamePollTimer); gamePollTimer = null; }
  }else{
    renderGame();
    if(!gamePollTimer) gamePollTimer = setInterval(pollGame, 4000);
  }
}

/* ===================== Game: data layer ===================== */
async function fetchGameState(){
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?type=game');
    return await res.json();
  }catch(e){
    console.error('game fetch failed', e);
    return null;
  }
}

async function sendGameAction(action, payload){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ scope: 'game', action }, payload || {}))
    });
    return await res.json();
  }catch(e){
    console.error('game action failed', e);
    return null;
  }
}

async function verifyPassword(id, password, newPassword){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ scope: 'auth', id, password, newPassword: newPassword || undefined })
    });
    const data = await res.json();
    return !!(data && data.ok);
  }catch(e){
    console.error('verify failed', e);
    return false;
  }
}

let gameState = null;

async function pollGame(){
  const state = await fetchGameState();
  if(state) { gameState = state; renderGame(); }
}

/* ===================== Game: UI ===================== */
function whoAmIPicker(onPicked){
  const root = document.getElementById('whoAmIRoot');
  const options = members.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
  root.innerHTML = `
    <div class="overlay" id="whoOverlay">
      <div class="modal">
        <button class="close-x" id="whoClose">✕</button>
        <h3>اول بگو تو کدومی</h3>
        <p class="sub">این فقط برای شناسایی توئه تو بازی</p>
        <div class="field">
          <select id="whoAmISelect" class="name-select">
            <option value="">— انتخاب کن —</option>
            ${options}
          </select>
        </div>
        <div class="field">
          <label>رمز فعلیت:</label>
          <input type="password" id="whoAmIPassword" placeholder="رمزی که تو پی‌وی بهت داده شد">
        </div>
        <div class="field">
          <button type="button" class="btn btn-ghost" id="whoTogglePw" style="width:100%;">🔒 می‌خوام رمزمو عوض کنم</button>
          <div id="whoPwChangeArea" style="display:none;margin-top:10px;">
            <label>رمز جدید:</label>
            <input type="password" id="whoNewPassword" placeholder="حداقل ۴ کاراکتر">
            <label style="margin-top:8px;display:block;">تکرار رمز جدید:</label>
            <input type="password" id="whoNewPasswordConfirm" placeholder="دوباره بنویسش">
          </div>
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px;" id="whoConfirm">تایید</button>
      </div>
    </div>`;
  document.getElementById('whoTogglePw').onclick = ()=>{
    const pwArea = document.getElementById('whoPwChangeArea');
    pwArea.style.display = pwArea.style.display === 'none' ? '' : 'none';
  };
  document.getElementById('whoClose').onclick = ()=> root.innerHTML = '';
  document.getElementById('whoOverlay').onclick = (e)=>{ if(e.target.id==='whoOverlay') root.innerHTML=''; };
  document.getElementById('whoConfirm').onclick = async ()=>{
    const id = parseInt(document.getElementById('whoAmISelect').value);
    const password = document.getElementById('whoAmIPassword').value;
    const m = members.find(x=>x.id===id);
    if(!m || !password){ showToast('اسم و رمزتو وارد کن'); return; }
    let newPassword = null;
    if(document.getElementById('whoPwChangeArea').style.display !== 'none'){
      const np = document.getElementById('whoNewPassword').value;
      const npc = document.getElementById('whoNewPasswordConfirm').value;
      if(np.length < 4){ showToast('رمز جدید باید حداقل ۴ کاراکتر باشه'); return; }
      if(np !== npc){ showToast('تکرار رمز جدید درست نیست'); return; }
      newPassword = np;
    }
    const btn = document.getElementById('whoConfirm');
    btn.disabled = true; btn.textContent = 'در حال بررسی...';
    const verified = await verifyPassword(id, password, newPassword);
    btn.disabled = false; btn.textContent = 'تایید';
    if(!verified){ showToast('رمز اشتباهه ❌'); return; }
    me = { id: m.id, name: m.name, password: newPassword || password };
    root.innerHTML = '';
    if(newPassword) showToast('رمزت عوض شد ✅');
    onPicked && onPicked();
  };
}

async function renderGame(){
  const root = document.getElementById('gameView');
  if(!me){
    root.innerHTML = `
      <div class="game-card">
        <h3>🍾 جرأت یا حقیقت</h3>
        <p class="sub">اول باید بگی تو کدوم عضو گروهی</p>
        <button class="btn btn-primary" id="pickMeBtn">من رو انتخاب کن</button>
      </div>`;
    document.getElementById('pickMeBtn').onclick = ()=> whoAmIPicker(renderGame);
    return;
  }

  if(!gameState) gameState = await fetchGameState();
  const s = gameState || { status: 'closed', players: [] };
  const isHost = me.name === 'حسین';

  if(s.status === 'closed'){
    root.innerHTML = `
      <div class="game-card">
        <h3>🍾 جرأت یا حقیقت</h3>
        <p class="sub">${isHost ? 'الان می‌تونی یه روم جدید باز کنی و تو گروه اعلامش کنی.' : 'الان بازی فعالی نیست. صبر کن حسین یه روم باز کنه و تو گروه اعلام کنه.'}</p>
        ${isHost ? '<button class="btn btn-primary" id="createRoomBtn">شروع روم جدید</button>' : ''}
      </div>`;
    if(isHost){
      document.getElementById('createRoomBtn').onclick = async ()=>{
        await sendGameAction('create', { id: me.id, host: me.name, password: me.password });
        await pollGame();
        showToast('روم باز شد، حالا تو گروه اعلامش کن 🎉');
      };
    }
    return;
  }

  if(s.status === 'waiting'){
    const players = s.players || [];
    const iJoined = players.some(p=>p.id===me.id);
    root.innerHTML = `
      <div class="game-card">
        <h3>🍾 منتظر بازیکن‌ها...</h3>
        <p class="sub">حداقل ۴ نفر باید آماده باشن تا بازی شروع بشه</p>
        <div>${players.length ? players.map(p=>`<span class="player-chip">${escapeHtml(p.name)}</span>`).join('') : '<span class="sub">هنوز کسی نپیوسته</span>'}</div>
        <p class="sub" style="margin-top:10px;">${players.length} نفر آماده‌ان</p>
        ${!iJoined ? '<button class="btn btn-primary" id="joinBtn">ملحق شو + آماده‌ام ✅</button>' : '<p class="sub">✅ تو لیست آماده‌هایی</p>'}
        ${isHost && players.length >= 4 ? '<button class="btn btn-primary" id="startBtn" style="margin-top:10px;">شروع بازی 🍾</button>' : ''}
        ${isHost ? '<button class="btn btn-ghost" id="closeRoomBtn" style="margin-top:10px;">بستن روم</button>' : ''}
      </div>`;
    if(!iJoined){
      document.getElementById('joinBtn').onclick = async ()=>{
        await sendGameAction('join', { id: me.id, name: me.name, password: me.password });
        await pollGame();
      };
    }
    if(isHost && players.length >= 4){
      document.getElementById('startBtn').onclick = async ()=>{
        await sendGameAction('start', {});
        await pollGame();
      };
    }
    if(isHost){
      document.getElementById('closeRoomBtn').onclick = async ()=>{
        await sendGameAction('close', {});
        await pollGame();
      };
    }
    return;
  }

  if(s.status === 'playing'){
    const order = s.order || [];
    const currentPlayer = order[s.currentIndex] || null;
    const myTurn = currentPlayer && currentPlayer.id === me.id;
    const result = s.spinResult;
    root.innerHTML = `
      <div class="game-card">
        <h3>🍾 بازی شروع شده</h3>
        <div>${order.map(p=>`<span class="player-chip ${currentPlayer && p.id===currentPlayer.id ? 'turn':''}">${escapeHtml(p.name)}</span>`).join('')}</div>
        <p class="sub" style="margin-top:12px;">${myTurn ? '🌟 نوبت توئه! بزن رو بطری تا بچرخه' : `نوبت ${currentPlayer ? escapeHtml(currentPlayer.name) : '...'}`}</p>
        <div class="bottle-wrap">
          <span class="bottle-emoji ${myTurn ? '' : 'disabled'}" id="bottleEl">🍾</span>
        </div>
        ${result ? `<div class="spin-result">بطری بین <b>${escapeHtml(result.p1)}</b> و <b>${escapeHtml(result.p2)}</b> ایستاد!</div>` : ''}
        ${isHost ? '<button class="btn btn-ghost" id="closeRoomBtn" style="margin-top:16px;">پایان بازی</button>' : ''}
      </div>`;
    if(myTurn){
      document.getElementById('bottleEl').onclick = async function(){
        const el = this;
        el.classList.add('disabled');
        const spins = 5 + Math.floor(Math.random()*3);
        el.style.transform = `rotate(${spins*360 + Math.floor(Math.random()*360)}deg)`;
        await sendGameAction('spin', { id: me.id });
        setTimeout(pollGame, 2300);
      };
    }
    if(isHost){
      document.getElementById('closeRoomBtn').onclick = async ()=>{
        await sendGameAction('close', {});
        await pollGame();
      };
    }
    return;
  }
}

(async function init(){
  await loadMembers();
  renderList();
  setInterval(async ()=>{
    await loadMembers();
    renderList();
  }, REFRESH_MS);
})();
</script>
