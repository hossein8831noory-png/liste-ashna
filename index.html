<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لیست بچه‌های گروه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
  :root{
    --blush:#e88ab0;
    --lilac:#b083d6;
    --peach:#ff8f6b;
    --rose:#ff4f8b;
    --plum:#3a1f30;
    --plum-soft:#7a4f68;
    --gold:#d9a441;
    --ok-green:#8fae8a;
    --card:#fffaf9;
    --neon-pink:#ff2e88;
    --neon-cyan:#00e5ff;
    --neon-purple:#a742ff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Vazirmatn', sans-serif;
    color:var(--plum);
    min-height:100vh;
    background:
      radial-gradient(circle at 12% 15%, rgba(255,79,139,.35), transparent 45%),
      radial-gradient(circle at 88% 12%, rgba(167,66,255,.32), transparent 50%),
      radial-gradient(circle at 50% 95%, rgba(255,143,107,.32), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(0,229,255,.10), transparent 60%),
      linear-gradient(160deg, #3a1240, #5c1a4a 45%, #7a1f4e 100%);
    background-attachment:fixed;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size:38px 38px;
  }
  .site-sticker{
    position:fixed; font-size:24px; z-index:0; pointer-events:none;
    opacity:.5;
    animation:float 9s ease-in-out infinite;
  }
  @media (prefers-reduced-motion: reduce){
    .site-sticker, .blob{ animation:none !important; }
  }

  .blob{
    position:fixed; border-radius:50%; filter:blur(30px); opacity:.4; z-index:0; pointer-events:none;
    animation:float 14s ease-in-out infinite;
  }
  .blob1{width:280px;height:280px;background:#f6b8cd;top:-60px;left:-60px;}
  .blob2{width:340px;height:340px;background:#d7bdf0;bottom:-100px;right:-80px;animation-delay:2s;}
  .blob3{width:200px;height:200px;background:#ffd0b0;bottom:20%;left:10%;animation-delay:4s;}
  @keyframes float{
    0%,100%{transform:translateY(0) translateX(0);}
    50%{transform:translateY(-24px) translateX(14px);}
  }
  @media (prefers-reduced-motion: reduce){ .blob{animation:none;} }

  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:18px 16px 60px;}

  .designer-tag{
    text-align:center;font-size:12px;letter-spacing:2px;color:rgba(255,235,245,.65);
    opacity:.85;margin-bottom:6px;text-transform:uppercase;position:relative;z-index:1;
  }

  header.hero{text-align:center;padding:18px 10px 26px;position:relative;z-index:1;}
  header.hero h1{
    font-size:32px;margin:0 0 6px;font-weight:800;color:#fff0f7;
    letter-spacing:.5px;text-shadow:0 2px 18px rgba(255,46,136,.45);
  }
  header.hero h1 span{color:#ffd166;}
  header.hero p{margin:0;color:rgba(255,235,245,.8);font-size:14.5px;line-height:1.8;}

  .toolbar{
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0 8px;position:relative;z-index:1;
  }
  .btn{
    border:none;cursor:pointer;padding:11px 22px;border-radius:999px;font-family:inherit;
    font-size:14.5px;font-weight:600;transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg,var(--rose),#d9748c);color:#fff;box-shadow:0 6px 18px rgba(216,116,140,.35);}
  .btn-primary:hover{box-shadow:0 8px 22px rgba(216,116,140,.45);}
  .btn-ghost{background:rgba(255,255,255,.85);color:var(--plum);border:1px solid rgba(139,100,120,.25);}
  .btn-ghost:hover{background:rgba(255,255,255,1);}

  .status-legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:14px 0 24px;font-size:13px;color:rgba(255,235,245,.8);position:relative;z-index:1;}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:middle;}

  .section-title{
    display:flex;align-items:center;gap:10px;margin:34px 0 14px;
  }
  .section-title h2{font-size:17px;margin:0;font-weight:700;color:#fff0f7;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.35);}
  .section-title .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,235,245,.35),transparent);}
  .section-title .count{font-size:12.5px;color:var(--plum-soft);background:rgba(255,255,255,.85);padding:2px 10px;border-radius:999px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}

  .card{
    background:var(--card);
    border-radius:20px;
    padding:16px 16px 14px;
    box-shadow:0 8px 24px rgba(139,80,105,.10);
    border:1px solid rgba(255,255,255,.7);
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(139,80,105,.16);}
  .card .name{font-size:16.5px;font-weight:700;margin:0 0 4px;color:var(--plum);}
  .badge{
    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
    padding:3px 10px;border-radius:999px;margin-bottom:9px;
  }
  .badge.single{background:#fdeef1;color:var(--rose);}
  .badge.relationship{background:#f1ece0;color:#a9843a;}
  .badge.unknown{background:#eef0ea;color:#7a8a6e;}
  .card .bio{font-size:13px;line-height:1.75;color:var(--plum-soft);min-height:20px;margin-bottom:10px;white-space:pre-wrap;}
  .card .bio.empty{font-style:italic;opacity:.6;}
  .rubika-link{
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    color:#fff;background:linear-gradient(135deg,var(--rose),#c9647e);
    padding:7px 12px;border-radius:12px;text-decoration:none;
  }
  .rubika-link:hover{filter:brightness(1.06);}
  .private-tag{font-size:12px;color:var(--plum-soft);opacity:.7;}

  .empty-state{text-align:center;color:var(--plum-soft);font-size:14px;padding:30px 0;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(74,46,58,.35);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal{
    background:#fffdfc;border-radius:22px;max-width:420px;width:100%;
    padding:24px 22px;box-shadow:0 20px 50px rgba(90,50,65,.25);
    max-height:88vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 4px;font-size:18px;color:var(--plum);}
  .modal .sub{font-size:13px;color:var(--plum-soft);margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--plum);margin-bottom:6px;}
  select, textarea, input[type=text]{
    width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(139,100,120,.25);
    font-family:inherit;font-size:14px;background:#fff;color:var(--plum);resize:vertical;
  }
  select:focus, textarea:focus, input:focus{outline:2px solid var(--rose);outline-offset:1px;}
  .radio-row{display:flex;gap:8px;flex-wrap:wrap;}
  .radio-pill{
    flex:1;min-width:90px;text-align:center;padding:9px 8px;border-radius:12px;
    border:1.5px solid rgba(139,100,120,.25);cursor:pointer;font-size:13px;font-weight:600;color:var(--plum-soft);
    transition:all .15s ease;
  }
  .radio-pill input{display:none;}
  .radio-pill.active-single{border-color:var(--rose);background:#fdeef1;color:var(--rose);}
  .radio-pill.active-relationship{border-color:var(--gold);background:#f7efdd;color:#a9843a;}
  .radio-pill.active-unknown{border-color:#8fae8a;background:#eef0ea;color:#5f7256;}
  .badge-pill{
    flex:1;min-width:70px;text-align:center;padding:8px 6px;border-radius:12px;
    border:1.5px solid rgba(139,100,120,.25);cursor:pointer;font-size:12px;font-weight:600;color:var(--plum-soft);
    transition:all .15s ease;
  }
  .badge-pill-active{border-color:var(--gold);background:#fdf3df;color:#a9843a;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .close-x{position:absolute;top:14px;left:14px;background:none;border:none;font-size:18px;color:var(--plum-soft);cursor:pointer;}
  .modal{position:relative;}
  .note{font-size:12px;color:var(--plum-soft);margin-top:10px;line-height:1.7;}
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--plum);color:#fff;padding:10px 20px;border-radius:999px;font-size:13.5px;
    box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:60;opacity:0;transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}
  footer.foot{text-align:center;margin-top:36px;font-size:12px;color:rgba(255,235,245,.7);opacity:.9;position:relative;z-index:1;}
  .music-btn{
    position:fixed; bottom:18px; left:18px; z-index:50;
    width:46px;height:46px;border-radius:50%;border:none;font-size:19px;cursor:pointer;
    background:linear-gradient(135deg,var(--rose),#a742ff); color:#fff;
    box-shadow:0 6px 18px rgba(167,66,255,.4);
  }
  .music-btn.playing{ animation:musicPulse 1.6s ease-in-out infinite; }
  @keyframes musicPulse{ 0%,100%{box-shadow:0 6px 18px rgba(167,66,255,.4);} 50%{box-shadow:0 6px 26px rgba(255,46,136,.55);} }



  /* VIP cards */
  .vip-wrap{ position:relative; padding:10px; }
  @keyframes rgbShift{ 0%{background-position:0% 50%;} 100%{background-position:400% 50%;} }

  .vip-card{
    position:relative; z-index:1;
    border:3px solid transparent;
    background-clip:padding-box, border-box;
    background-origin:padding-box, border-box;
    background-image: linear-gradient(160deg,#fffaf9,#fff3e0), linear-gradient(90deg,#ff5f6d,#ffc371,#f9f871,#63e6be,#63b3ed,#a78bfa);
    box-shadow:0 6px 18px rgba(167,66,255,.18);
  }
  .vip-card.vip-boy{ background-image: linear-gradient(160deg,#fbfdff,#e6f2ff), linear-gradient(90deg,#ff5f6d,#ffc371,#f9f871,#63e6be,#63b3ed,#a78bfa); }
  .vip-card.vip-girl{ background-image: linear-gradient(160deg,#fffafc,#ffe9f3), linear-gradient(90deg,#ff5f6d,#ffc371,#f9f871,#63e6be,#63b3ed,#a78bfa); }

  .vip-ribbon{
    position:absolute; top:14px; right:-30px; width:120px; text-align:center;
    transform:rotate(45deg); background:linear-gradient(135deg,#e8c76b,#c9a227); color:#fff;
    font-size:11px; font-weight:800; letter-spacing:1px; padding:3px 0; z-index:2;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
  }
  .vip-crown{position:absolute;top:-10px;left:14px;font-size:22px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));z-index:2;}
  .vip-avatar{
    width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;margin:0 0 8px;
    border:2px solid #c9a227;
  }
  .vip-sticker{
    position:absolute; font-size:20px; z-index:3; pointer-events:none;
    animation:vipFloat 3.6s ease-in-out infinite;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));
  }
  .vip-sticker-0{ top:-6px; left:-6px; animation-delay:0s; }
  .vip-sticker-1{ top:20%; right:-10px; animation-delay:.6s; }
  .vip-sticker-2{ bottom:14%; left:-10px; animation-delay:1.2s; }
  .vip-sticker-3{ bottom:-8px; right:8px; animation-delay:1.8s; }
  @keyframes vipFloat{
    0%,100%{ transform:translateY(0) rotate(-4deg); }
    50%{ transform:translateY(-8px) rotate(6deg); }
  }
  .age-badge{ font-size:11.5px; font-weight:700; color:var(--plum-soft); background:rgba(139,100,120,.1); padding:2px 8px; border-radius:999px; }

  .vip-name{
    font-weight:800; letter-spacing:.3px;
    background:linear-gradient(90deg, #ff5f6d,#ffc371,#f9f871,#63e6be,#63b3ed,#a78bfa,#ff5f6d);
    background-size:300% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:rgbShift 8s steps(24) infinite;
    text-shadow:none;
  }
  .vip-badges{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
  .vip-badge-chip{
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px;
    background:linear-gradient(135deg,#2b2b3d,#1a1a2a); color:#fff;
    border:1px solid rgba(255,255,255,.15);
  }
  .vip-quote{ font-size:13px; font-style:italic; color:var(--plum-soft); line-height:1.8; margin:6px 0 10px; }
  .vip-tags{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
  .vip-tag-chip{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px;
    background:rgba(0,229,255,.12); color:#0891a8; border:1px solid rgba(0,229,255,.3);
  }
  .vip-talents{
    font-size:12.5px; color:var(--plum-soft); background:rgba(217,164,65,.12);
    border:1px dashed rgba(217,164,65,.4); border-radius:12px; padding:8px 10px; margin-bottom:10px; line-height:1.8;
  }
  .vip-rubika{
    position:relative; background:linear-gradient(135deg,#1a1a2a,#2b2b3d) !important;
    border:1px solid transparent;
    background-image:linear-gradient(#1a1a2a,#1a1a2a), linear-gradient(90deg,#ff5f6d,#63e6be,#63b3ed,#a78bfa,#ff5f6d);
    background-origin:border-box; background-clip:padding-box, border-box;
    background-size:100% 100%, 300% 100%;
    animation:rgbShift 8s steps(24) infinite;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  .vip-card:active{ transform:scale(.985); }

  /* Owner card (حسین) — extra glow + sidebar + online dot */
  .owner-wrap{ padding-left:34px; }
  .owner-card{
    background-image: linear-gradient(160deg,#12101c,#1b1430), linear-gradient(90deg,#ff5f6d,#f9f871,#63e6be,#63b3ed,#a78bfa,#ff5f6d);
    background-size:100% 100%, 300% 100%;
    animation:rgbShift 8s steps(24) infinite;
    color:#f0e9ff;
  }
  .owner-card::after{ background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%); }
  .owner-card .badge{ filter:brightness(1.15); }
  .owner-card .bio, .owner-card .bio.empty{ color:#cdbfe0; }
  .owner-sidebar{
    position:absolute; top:14px; bottom:14px; left:-30px; width:22px;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between; z-index:2;
  }
  .owner-dotgrid{
    width:16px;height:16px;
    background-image:radial-gradient(rgba(167,139,250,.8) 1.5px, transparent 1.5px);
    background-size:5px 5px;
  }
  .owner-sidebar-text{
    writing-mode:vertical-rl; font-size:10px; font-weight:800; letter-spacing:2px;
    color:#a78bfa; text-shadow:0 0 6px rgba(167,139,250,.7);
  }
  .owner-bolt{ font-size:16px; filter:drop-shadow(0 0 6px #a78bfa); }
  .owner-ribbon{
    position:absolute; top:-12px; right:16px; z-index:2;
    background:linear-gradient(135deg,#a78bfa,#5b9fe0); color:#fff; font-size:11px; font-weight:800;
    padding:5px 14px; border-radius:999px; letter-spacing:1px;
    box-shadow:0 4px 14px rgba(167,139,250,.5);
  }
  .owner-crown{ font-size:26px; filter:drop-shadow(0 0 10px rgba(255,209,102,.8)); animation:crownPulse 2s ease-in-out infinite; }
  @keyframes crownPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.12);} }
  .owner-avatar-wrap{ position:relative; display:inline-block; }
  .owner-avatar{ width:72px;height:72px; border:2.5px solid transparent;
    background-image:linear-gradient(#12101c,#12101c), linear-gradient(90deg,#a78bfa,#63b3ed,#a78bfa);
    background-origin:border-box; background-clip:padding-box, border-box;
    background-size:100% 100%, 300% 100%; animation:rgbShift 8s steps(24) infinite;
  }
  .owner-online-dot{
    position:absolute; bottom:4px; left:2px; width:12px;height:12px; border-radius:50%;
    background:#3ddc84; border:2px solid #12101c; box-shadow:0 0 8px #3ddc84;
    animation:dotPulse 1.6s ease-in-out infinite;
  }
  @keyframes dotPulse{ 0%,100%{opacity:1;} 50%{opacity:.5;} }
  .owner-name{ font-size:19px; }
  .owner-quote{
    position:relative; font-size:14px; color:#cdbfe0; line-height:1.9; margin:10px 0 14px;
    background:rgba(167,139,250,.08); border:1px dashed rgba(167,139,250,.35); border-radius:14px; padding:14px 16px 14px 16px;
  }
  .owner-quote::before{ content:'"'; position:absolute; top:-6px; right:10px; font-size:34px; color:#a78bfa; opacity:.6; }


  .vip-avatar-placeholder{
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;
    background:linear-gradient(135deg,#c9a227,#e8c76b);
  }
  .avatar-upload-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-top:8px;border:2px solid #c9a227;}

</style>
</head>

let members = [];

function statusLabel(s){
  return s==='single' ? 'سینگل' : s==='relationship' ? 'تو رابطه' : 'وضعیت نامعلوم';
}

/* VIP members: id -> 'boy' | 'girl' (controls card styling + who can upload an avatar) */
const VIP_MAP = { 15: 'boy', 4: 'boy', 16: 'girl', 0: 'girl' };
const OWNER_ID = 15;
function isVip(id){ return Object.prototype.hasOwnProperty.call(VIP_MAP, id); }

function parseExtra(raw){
  const base = { talents:'', quote:'', tags:[], badges:[] };
  if(!raw) return base;
  try{
    const p = JSON.parse(raw);
    return {
      talents: String(p.talents || ''),
      quote: String(p.quote || ''),
      tags: Array.isArray(p.tags) ? p.tags.slice(0,6) : [],
      badges: Array.isArray(p.badges) ? p.badges.slice(0,4) : []
    };
  }catch(e){ return base; }
}

async function loadMembers(){
  try{
    const res = await fetch(APPS_SCRIPT_URL, { method: 'GET' });
    const data = await res.json();
    members = data.map(raw => {
      // the sheet's header row may have stray spaces/casing; normalize keys
      // (e.g. "name " -> "name") before reading each field
      const norm = {};
      Object.keys(raw).forEach(k => { norm[k.trim().toLowerCase()] = raw[k]; });
      return {
        id: Number(norm.id),
        name: String(norm.name || '').trim(),
        status: String(norm.status || 'unknown').trim(),
        rubika: String(norm.rubika || '').trim(),
        bio: String(norm.bio || ''),
        avatar: String(norm.avatar || ''),
        age: norm.age ? Number(norm.age) : null,
        extra: parseExtra(norm.extra)
      };
    });
  }catch(e){
    console.error('load failed', e);
    if(!members.length) members = SEED;
    showToast('اتصال به لیست برقرار نشد، لیست ذخیره‌شده‌ی قبلی نشون داده می‌شه');
  }
}

async function saveMember(m, password, newPassword, avatar, age, extra){
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight Apps Script can't handle
      body: JSON.stringify({ id: m.id, status: m.status, rubika: m.rubika, bio: m.bio, password: password, newPassword: newPassword || undefined, avatar: avatar || undefined, age: age, extra: extra || undefined })
    });
    const data = await res.json();
    return { ok: !!(data && data.ok), error: data && data.error };
  }catch(e){
    console.error('save failed', e);
    return { ok: false };
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

function rubikaHref(handle){
  const clean = handle.replace(/^@/, '').trim();
  return 'https://rubika.ir/' + encodeURIComponent(clean);
}

const VIP_STICKERS = { boy: ['⚡','🔥'], girl: ['✨','💎'] };
const BADGE_OPTIONS = [
  {key:'vip', label:'👑 VIP'},
  {key:'og', label:'⚡ OG'},
  {key:'gamer', label:'🎮 Gamer'},
  {key:'premium', label:'💎 Premium'},
  {key:'verified', label:'🛡️ Verified'}
];

function renderCard(m){
  const bioText = m.bio && m.bio.trim() ? m.bio.trim() : 'هنوز چیزی درباره خودش ننوشته';
  const bioClass = m.bio && m.bio.trim() ? 'bio' : 'bio empty';
  const rubikaBlock = m.status === 'single'
    ? `<a class="rubika-link" href="${rubikaHref(m.rubika)}" target="_blank" rel="noopener">💬 ${m.rubika}</a>`
    : `<span class="private-tag">آیدی نمایش داده نمی‌شه</span>`;
  const ageBadge = m.age ? `<span class="age-badge">${m.age} سال</span>` : '';
  const vipKind = VIP_MAP[m.id];

  if(!vipKind){
    return `
      <div class="card">
        <p class="name">${escapeHtml(m.name)} ${ageBadge}</p>
        <span class="badge ${m.status}">${statusLabel(m.status)}</span>
        <p class="${bioClass}">${escapeHtml(bioText)}</p>
        ${rubikaBlock}
      </div>`;
  }

  const isOwner = m.id === OWNER_ID;
  const avatarBlock = m.avatar
    ? `<img class="vip-avatar" src="${m.avatar}" alt="">`
    : `<div class="vip-avatar vip-avatar-placeholder">${escapeHtml(m.name.slice(0,1))}</div>`;
  const avatarWrapped = isOwner
    ? `<div class="owner-avatar-wrap">${avatarBlock.replace('vip-avatar','vip-avatar owner-avatar')}<span class="owner-online-dot"></span></div>`
    : avatarBlock;
  const stickers = VIP_STICKERS[vipKind];
  const stickerSpans = stickers.map((s,i)=>`<span class="vip-sticker vip-sticker-${i}">${s}</span>`).join('');

  const vipRubikaBlock = m.status === 'single'
    ? `<a class="rubika-link vip-rubika" href="${rubikaHref(m.rubika)}" target="_blank" rel="noopener">💬 ${m.rubika}</a>`
    : `<span class="private-tag">آیدی نمایش داده نمی‌شه</span>`;

  const ex = m.extra || { talents:'', quote:'', tags:[], badges:[] };
  const badgeChips = (ex.badges||[]).map(k=>{
    const b = BADGE_OPTIONS.find(x=>x.key===k);
    return b ? `<span class="vip-badge-chip">${b.label}</span>` : '';
  }).join('');
  const quoteOrBio = ex.quote && ex.quote.trim()
    ? `<p class="vip-quote ${isOwner?'owner-quote':''}">${isOwner?'':'«'}${escapeHtml(ex.quote.trim())}${isOwner?'':'»'}</p>`
    : `<p class="${bioClass}">${escapeHtml(bioText)}</p>`;
  const tagChips = (ex.tags||[]).length
    ? `<div class="vip-tags">${ex.tags.map(t=>`<span class="vip-tag-chip">${escapeHtml(t)}</span>`).join('')}</div>` : '';
  const talentsBlock = ex.talents && ex.talents.trim()
    ? `<div class="vip-talents">🌟 استعدادها: ${escapeHtml(ex.talents.trim())}</div>` : '';

  const ownerExtras = isOwner ? `
    <span class="owner-sidebar">
      <span class="owner-dotgrid"></span>
      <span class="owner-sidebar-text">VIP MEMBER</span>
      <span class="owner-bolt">⚡</span>
    </span>
    <span class="owner-ribbon">👑 OWNER</span>` : '';

  return `
    <div class="vip-wrap ${isOwner?'owner-wrap':''}">
      ${stickerSpans}
      <div class="card vip-card vip-${vipKind} ${isOwner?'owner-card':''}">
        ${ownerExtras}
        ${!isOwner ? '<span class="vip-ribbon">VIP</span>' : ''}
        <span class="vip-crown ${isOwner?'owner-crown':''}">👑</span>
        ${avatarWrapped}
        <p class="name vip-name ${isOwner?'owner-name':''}">${escapeHtml(m.name)} ${ageBadge}</p>
        ${badgeChips ? `<div class="vip-badges">${badgeChips}</div>` : ''}
        <span class="badge ${m.status}">${statusLabel(m.status)}</span>
        ${quoteOrBio}
        ${tagChips}
        ${talentsBlock}
        ${vipRubikaBlock}
      </div>
    </div>`;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderList(){
  const root = document.getElementById('listRoot');
  if(!members.length){ root.innerHTML = '<div class="empty-state">لیست خالیه</div>'; return; }

  const groups = [
    {key:'single', title:'سینگل‌ها'},
    {key:'relationship', title:'تو رابطه‌ان'},
    {key:'unknown', title:'وضعیت نامعلوم'},
  ];

  let html = '';
  groups.forEach(g=>{
    const items = members.filter(m=>m.status===g.key)
      .sort((a,b)=> (isVip(b.id)?1:0) - (isVip(a.id)?1:0));
    if(!items.length) return;
    html += `
      <div class="section-title">
        <h2>${g.title}</h2>
        <div class="line"></div>
        <span class="count">${items.length} نفر</span>
      </div>
      <div class="grid">${items.map(renderCard).join('')}</div>`;
  });
  root.innerHTML = html;
}

function openIdentifyModal(){
  const root = document.getElementById('modalRoot');
  const options = members.map(m=>`<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <button class="close-x" id="closeModal">✕</button>
        <h3>خودت رو انتخاب کن</h3>
        <p class="sub">اول بگو کدوم یکی از لیست تویی، بعد وضعیتت رو آپدیت کن</p>
        <div class="field">
          <label>اسم من:</label>
          <select id="whoSelect">
            <option value="">— انتخاب کن —</option>
            ${options}
          </select>
        </div>
        <div id="editArea"></div>
      </div>
    </div>`;
  document.getElementById('closeModal').onclick = closeModal;
  document.getElementById('overlay').onclick = (e)=>{ if(e.target.id==='overlay') closeModal(); };
  document.getElementById('whoSelect').onchange = (e)=>{
    const id = e.target.value;
    renderEditArea(id === '' ? null : parseInt(id));
  };
}

function renderEditArea(id){
  const area = document.getElementById('editArea');
  if(id === null){ area.innerHTML = ''; return; }
  const m = members.find(x=>x.id===id);
  area.innerHTML = `
    <div class="field">
      <label>وضعیت فعلیم:</label>
      <div class="radio-row" id="statusRow">
        <label class="radio-pill ${m.status==='single'?'active-single':''}" data-val="single">
          <input type="radio" name="st" value="single" ${m.status==='single'?'checked':''}>سینگل
        </label>
        <label class="radio-pill ${m.status==='relationship'?'active-relationship':''}" data-val="relationship">
          <input type="radio" name="st" value="relationship" ${m.status==='relationship'?'checked':''}>تو رابطه
        </label>
        <label class="radio-pill ${m.status==='unknown'?'active-unknown':''}" data-val="unknown">
          <input type="radio" name="st" value="unknown" ${m.status==='unknown'?'checked':''}>نامعلوم
        </label>
      </div>
    </div>
    <div class="field">
      <label>آیدی روبیکام:</label>
      <input type="text" id="rubikaInput" value="${escapeHtml(m.rubika)}">
    </div>
    <div class="field">
      <label>یه کم درباره خودم (اخلاق، ویژگی‌ها، علایق و ...):</label>
      <textarea id="bioInput" rows="4" placeholder="مثلاً: آرومم، شوخ‌طبعم، عاشق فیلمم، دنبال یکی که...">${escapeHtml(m.bio||'')}</textarea>
    </div>
    <div class="field">
      <label>سنت:</label>
      <input type="number" id="ageInput" min="1" max="100" placeholder="مثلاً: ۲۲" value="${m.age || ''}">
    </div>
    ${isVip(m.id) ? `
    <div class="field">
      <label>👑 عکس پروفایل کارت VIP:</label>
      <input type="file" accept="image/*" id="avatarInput">
      <img id="avatarPreview" class="avatar-upload-preview" style="display:${m.avatar ? '' : 'none'};" src="${m.avatar || ''}">
    </div>
    <div class="field">
      <label>🌟 استعدادهات (اختیاری):</label>
      <textarea id="talentsInput" rows="2" placeholder="مثلاً: گیتار می‌زنم، خوب آشپزی می‌کنم...">${escapeHtml((m.extra&&m.extra.talents)||'')}</textarea>
    </div>
    <div class="field">
      <label>یه جمله‌ی کوتاه زیر اسمت (اختیاری):</label>
      <input type="text" id="quoteInput" maxlength="60" placeholder="مثلاً: همیشه آروم، همیشه خودم" value="${escapeHtml((m.extra&&m.extra.quote)||'')}">
    </div>
    <div class="field">
      <label>علاقه‌مندی‌ها، با کاما جدا کن (اختیاری):</label>
      <input type="text" id="tagsInput" placeholder="🎮 گیم, 💻 کدنویسی, 🎵 موزیک" value="${escapeHtml(((m.extra&&m.extra.tags)||[]).join(', '))}">
    </div>
    <div class="field">
      <label>نشان‌ها (حداکثر ۳ تا):</label>
      <div class="radio-row" id="badgeRow">
        ${BADGE_OPTIONS.map(b=>`
          <label class="badge-pill ${(m.extra&&m.extra.badges||[]).includes(b.key)?'badge-pill-active':''}" data-badge="${b.key}">
            <input type="checkbox" value="${b.key}" ${(m.extra&&m.extra.badges||[]).includes(b.key)?'checked':''} style="display:none;">${b.label}
          </label>`).join('')}
      </div>
    </div>` : ''}
    <div class="field">
      <label>رمز فعلیت:</label>
      <input type="password" id="passwordInput" placeholder="رمزی که تو پی‌وی بهت داده شد">
    </div>
    <div class="field">
      <button type="button" class="btn btn-ghost" id="togglePwChange" style="width:100%;">🔒 می‌خوام رمزمو به دلخواه خودم عوض کنم</button>
      <div id="pwChangeArea" style="display:none;margin-top:10px;">
        <label>رمز جدید:</label>
        <input type="password" id="newPasswordInput" placeholder="حداقل ۴ کاراکتر">
        <label style="margin-top:8px;display:block;">تکرار رمز جدید:</label>
        <input type="password" id="newPasswordConfirm" placeholder="دوباره بنویسش">
      </div>
    </div>
    <p class="note">آیدی روبیکات فقط وقتی زیر کارتت نشون داده می‌شه که وضعیتت «سینگل» باشه.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelEdit">انصراف</button>
      <button class="btn btn-primary" id="saveEdit">ذخیره</button>
    </div>`;

  document.getElementById('togglePwChange').onclick = ()=>{
    const pwArea = document.getElementById('pwChangeArea');
    pwArea.style.display = pwArea.style.display === 'none' ? '' : 'none';
  };

  let pendingAvatar = null;
  const avatarInput = document.getElementById('avatarInput');
  if(avatarInput){
    avatarInput.onchange = ()=>{
      const file = avatarInput.files[0];
      if(!file) return;
      const img = new Image();
      const reader = new FileReader();
      reader.onload = (e)=>{
        img.onload = ()=>{
          const size = 160;
          const canvas = document.createElement('canvas');
          canvas.width = size; canvas.height = size;
          const ctx = canvas.getContext('2d');
          const side = Math.min(img.width, img.height);
          const sx = (img.width - side)/2, sy = (img.height - side)/2;
          ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
          pendingAvatar = canvas.toDataURL('image/jpeg', 0.6);
          const preview = document.getElementById('avatarPreview');
          preview.src = pendingAvatar;
          preview.style.display = '';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };
  }

  const badgeRow = document.getElementById('badgeRow');
  if(badgeRow){
    badgeRow.querySelectorAll('.badge-pill').forEach(pill=>{
      pill.addEventListener('click', ()=>{
        const cb = pill.querySelector('input');
        const activeCount = badgeRow.querySelectorAll('input:checked').length;
        if(!cb.checked && activeCount >= 3){ showToast('حداکثر ۳ تا نشان می‌تونی انتخاب کنی'); return; }
        cb.checked = !cb.checked;
        pill.classList.toggle('badge-pill-active', cb.checked);
      });
    });
  }

  area.querySelectorAll('.radio-pill').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      area.querySelectorAll('.radio-pill').forEach(p=>{
        p.classList.remove('active-single','active-relationship','active-unknown');
      });
      pill.classList.add('active-' + pill.dataset.val);
    });
  });

  document.getElementById('cancelEdit').onclick = closeModal;
  document.getElementById('saveEdit').onclick = async ()=>{
    const status = area.querySelector('input[name=st]:checked').value;
    const rubika = document.getElementById('rubikaInput').value.trim() || m.rubika;
    const bio = document.getElementById('bioInput').value.trim();
    const ageVal = parseInt(document.getElementById('ageInput').value);
    if(!ageVal || ageVal < 1 || ageVal > 100){ showToast('سنتو درست وارد کن'); return; }
    const password = document.getElementById('passwordInput').value;
    if(!password){ showToast('رمز فعلیتو وارد کن'); return; }
    let newPassword = null;
    if(document.getElementById('pwChangeArea').style.display !== 'none'){
      const np = document.getElementById('newPasswordInput').value;
      const npc = document.getElementById('newPasswordConfirm').value;
      if(np.length < 4){ showToast('رمز جدید باید حداقل ۴ کاراکتر باشه'); return; }
      if(np !== npc){ showToast('تکرار رمز جدید درست نیست'); return; }
      newPassword = np;
    }
    // look up the live object by id (not the closured "m") in case the
    // background auto-refresh replaced the members array while this was open
    const target = members.find(x=>x.id===id) || m;
    const prev = { status: target.status, rubika: target.rubika, bio: target.bio, avatar: target.avatar, age: target.age, extra: target.extra };
    target.status = status; target.rubika = rubika; target.bio = bio; target.age = ageVal;
    if(pendingAvatar) target.avatar = pendingAvatar;
    let extraJson = null;
    if(isVip(id)){
      const talents = (document.getElementById('talentsInput').value || '').trim();
      const quote = (document.getElementById('quoteInput').value || '').trim();
      const tags = (document.getElementById('tagsInput').value || '').split(',').map(t=>t.trim()).filter(Boolean).slice(0,6);
      const badges = badgeRow ? Array.from(badgeRow.querySelectorAll('input:checked')).map(cb=>cb.value) : [];
      const extraObj = { talents, quote, tags, badges };
      target.extra = extraObj;
      extraJson = JSON.stringify(extraObj);
    }
    const saveBtn = document.getElementById('saveEdit');
    saveBtn.disabled = true;
    saveBtn.textContent = 'در حال ذخیره...';
    const result = await saveMember(target, password, newPassword, pendingAvatar, ageVal, extraJson);
    if(result.ok){
      renderList();
      closeModal();
      showToast(newPassword ? 'ذخیره شد و رمزت عوض شد ✅' : 'وضعیتت آپدیت شد ✅');
      await loadMembers();
      renderList();
    }else{
      target.status = prev.status; target.rubika = prev.rubika; target.bio = prev.bio; target.avatar = prev.avatar; target.age = prev.age; target.extra = prev.extra;
      saveBtn.disabled = false;
      saveBtn.textContent = 'ذخیره';
      showToast(result.error === 'bad_password' ? 'رمز اشتباهه ❌' : 'ذخیره نشد، اتصالت رو چک کن و دوباره بزن');
    }
  };
}

function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

document.getElementById('openIdentify').onclick = openIdentifyModal;
document.getElementById('refreshBtn').onclick = async ()=>{
  await loadMembers();
  renderList();
  showToast('لیست بروز شد');
};

let lastMembersHash = '';

/* ===================== Background music ===================== */
const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicToggle');
bgMusic.volume = 0.45;
function setMusicBtnState(){
  musicBtn.textContent = bgMusic.paused ? '🎵' : '🔊';
  musicBtn.classList.toggle('playing', !bgMusic.paused);
}
function tryAutoplay(){
  bgMusic.play().then(setMusicBtnState).catch(()=>{ /* blocked until a tap happens */ });
}
musicBtn.onclick = (e)=>{
  e.stopPropagation();
  if(bgMusic.paused) bgMusic.play(); else bgMusic.pause();
  setMusicBtnState();
};
function unlockMusicOnce(){
  if(bgMusic.paused) tryAutoplay();
  ['click','touchstart','pointerdown','keydown'].forEach(evt=>{
    document.removeEventListener(evt, unlockMusicOnce, true);
  });
}
['click','touchstart','pointerdown','keydown'].forEach(evt=>{
  document.addEventListener(evt, unlockMusicOnce, true);
});
tryAutoplay();

(async function init(){
  await loadMembers();
  lastMembersHash = JSON.stringify(members);
  renderList();
  setInterval(async ()=>{
    await loadMembers();
    const h = JSON.stringify(members);
    if(h !== lastMembersHash){
      lastMembersHash = h;
      renderList();
    }
  }, REFRESH_MS);
})();
